spring:
  application:
    name: redis
  data:
    redis:
      host: localhost
      port: 6379
  boot:
    admin:
      client:
        url: http://localhost:8181
        instance:
          service-base-url: http://host.docker.internal:8080
server:
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 200
management:
  endpoints:
    web:
      exposure:
        include: metrics, health, info, threadDump, cpu
  endpoint:
    metrics:
      access: unrestricted
    # noinspection SpellCheckingInspection
    threaddump:
      access: unrestricted