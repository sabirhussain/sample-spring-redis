spring:
  application:
    name: redis
  ssl:
    bundle:
      pem:
        valkey-tls:
          truststore:
            certificate: classpath:certs/ca.crt
  data:
    redis:
      host: localhost
      port: 6379
      ssl:
        enabled: true
        bundle: valkey-tls
  boot:
    admin:
      client:
        url: http://localhost:8181
        instance:
          service-base-url: http://host.docker.internal:8080
server:
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 200
management:
  endpoints:
    web:
      exposure:
        include: metrics, health, info, threadDump
  endpoint:
    metrics:
      access: unrestricted
    # noinspection SpellCheckingInspection
    threaddump:
      access: unrestricted