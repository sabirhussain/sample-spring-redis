spring:
  application:
    name: redis
  data:
    redis:
      host: localhost
      port: 6379
  boot:
    admin:
      client:
        url: http://localhost:8181
        instance:
          service-base-url: http://host.docker.internal:8080
management:
  endpoints:
    web:
      exposure:
        include: metrics, health, info, threadDump
  endpoint:
    metrics:
      access: unrestricted
    threaddump:
      access: unrestricted